<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RescueSync{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">RescueSync</a>
      {% if session_user %}
      <form class="d-flex align-items-center gap-2 m-0" method="post" action="/logout">
        <span class="navbar-text small">{{ session_user.nombre }} · {{ rol_label[session_user.rol] }}</span>
        <button class="btn btn-outline-light btn-sm" type="submit">Salir</button>
      </form>
      {% endif %}
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
