services:
  db:
    image: postgres:16-alpine
    container_name: rescuesync-db
    environment:
      POSTGRES_USER: rescuesync
      POSTGRES_PASSWORD: rescuesync
      POSTGRES_DB: rescuesync
    ports:
      - "5432:5432"
    volumes:
      - rescuesync-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescuesync -d rescuesync"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rescuesync

  nacional:
    build: ./nacional
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+psycopg://rescuesync:rescuesync@db:5432/rescuesync
      PORT: "8002"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rescuesync

  backend:
    build: ./backend
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://rescuesync:rescuesync@db:5432/rescuesync
      NACIONAL_BASE_URL: http://nacional:8002
      PORT: "8001"
    depends_on:
      db:
        condition: service_healthy
      nacional:
        condition: service_started
    networks:
      - rescuesync

networks:
  rescuesync:
    driver: bridge

volumes:
  rescuesync-pgdata:
